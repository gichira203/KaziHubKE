# Render Blueprint for the KaziHub KE API and PostgreSQL database.
#
# The web app is deployed separately (Vercel — see DEPLOYMENT.md). Import this
# repository as a Blueprint on Render, or create a Web Service manually using
# the same root directory, build and start commands.
services:
  - type: pserv
    name: kazihub-db
    runtime: postgres
    plan: basic-256mb
    databaseName: kazihub
    user: kazihub

  - type: web
    name: kazihub-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      # Generated once by Render. Rotating it signs every user out.
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kazihub-db
          property: connectionString
      # Set these in the Render dashboard after the first deploy:
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
